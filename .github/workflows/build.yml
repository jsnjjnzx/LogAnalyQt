name: Build Windows and macOS

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: '1'

jobs:
  windows:
    name: Windows x64
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      QT_STATIC_DIR: D:/qt-static/6.11.1
      QT_QPA_PLATFORM: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check version and release tooling
        run: |
          Write-Host "Available logical CPUs: $([Environment]::ProcessorCount)"
          python scripts/ci/check_build.py
          if ($LASTEXITCODE -ne 0) { throw 'Version validation failed' }
          python -m unittest tests.test_release_automation tests.test_ci_packages tests.test_github_release -v
          if ($LASTEXITCODE -ne 0) { throw 'Release tooling tests failed' }
      - name: Install Qt test tools and MinGW
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.1'
          arch: win64_mingw
          tools: 'tools_mingw1310,qt.tools.win64_mingw1310'
          # aqt 3.3 predates Qt 6.11's Windows repository layout.
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7'
          cache: 'true'
          setup-python: 'false'
      - name: Locate MinGW 13.1
        shell: pwsh
        run: |
          $Mingw = Get-ChildItem "$env:IQTA_TOOLS" -Directory -Filter 'mingw1310*' | Select-Object -First 1
          if (-not $Mingw) { throw 'MinGW 13.1 not installed' }
          "MINGW_DIR=$($Mingw.FullName)" >> $env:GITHUB_ENV
      - name: Check QML test tools
        run: |
          python tests/prot698_qml_tests.py
          if ($LASTEXITCODE -ne 0) { throw 'QML test tools failed' }
      - name: Restore static Qt
        id: qt-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.QT_STATIC_DIR }}
          key: windows-2022-qt-6.11.1-mingw1310-static-${{ hashFiles('scripts/ci/build_static_qt.ps1') }}
      - name: Build static Qt on cache miss
        if: steps.qt-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./scripts/ci/build_static_qt.ps1 -InstallDir $env:QT_STATIC_DIR -MingwDir $env:MINGW_DIR
      - name: Save static Qt before building the application
        if: steps.qt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.QT_STATIC_DIR }}
          key: ${{ steps.qt-cache.outputs.cache-primary-key }}
      - name: Build, test and package
        shell: pwsh
        run: |
          ./scripts/package_single.ps1 -BuildTests
          if ($LASTEXITCODE -ne 0) { throw 'Windows packaging failed' }
          python scripts/ci/check_build.py --packages release_package --platform windows
          if ($LASTEXITCODE -ne 0) { throw 'Windows package validation failed' }
          $Package = Get-ChildItem release_package/*_Windows_x64.exe | Select-Object -First 1
          $Imports = & "$env:MINGW_DIR/bin/objdump.exe" -p $Package.FullName | Out-String
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect Windows imports' }
          if ($Imports -match 'DLL Name:\s+(Qt6|libgcc|libstdc|libwinpthread)') { throw 'Package still depends on Qt or MinGW DLLs' }
      - name: Run packaged EXE without Qt or MinGW on PATH
        shell: pwsh
        run: |
          $Python = (Get-Command python).Source
          $Package = Get-ChildItem release_package/*_Windows_x64.exe | Select-Object -First 1
          foreach ($PluginVariable in @('QT_PLUGIN_PATH', 'QT_QPA_PLATFORM_PLUGIN_PATH', 'QML_IMPORT_PATH', 'QML2_IMPORT_PATH')) {
            Remove-Item "Env:$PluginVariable" -ErrorAction SilentlyContinue
          }
          $env:PATH = "$env:SystemRoot/system32;$env:SystemRoot"
          $HiddenQt = @{}
          try {
            foreach ($QtDirectory in @($env:QT_STATIC_DIR, $env:QT_ROOT_DIR)) {
              $HiddenDirectory = "$QtDirectory-ci-hidden"
              Move-Item -LiteralPath $QtDirectory -Destination $HiddenDirectory
              $HiddenQt[$QtDirectory] = $HiddenDirectory
            }
            & $Python tests/test_ui_migration_runtime.py $Package.FullName
            if ($LASTEXITCODE -ne 0) { throw 'Standalone Windows package failed to run' }
            & $Python tests/test_github_update.py $Package.FullName --probe
            if ($LASTEXITCODE -ne 0) { throw 'Standalone Windows update HTTPS probe failed' }
          }
          finally {
            foreach ($QtDirectory in $HiddenQt.Keys) {
              Move-Item -LiteralPath $HiddenQt[$QtDirectory] -Destination $QtDirectory
            }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: LogAnalyQt-Windows-x64
          path: |
            release_package/*_Windows_x64.exe
            release_package/*_Windows_x64.exe.sha256
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish version tag
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: LogAnalyQt-*
          path: release_package
          merge-multiple: true
      - name: Verify and publish complete Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release/github_release.py --directory release_package --tag "$GITHUB_REF_NAME"

  verify-update:
    name: Verify published update (${{ matrix.platform }})
    needs: release
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows x64
            runner: windows-2022
            artifact: LogAnalyQt-Windows-x64
          - platform: macOS arm64
            runner: macos-15
            artifact: LogAnalyQt-macOS-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: packages
      - name: Exercise Windows app update from GitHub
        if: runner.os == 'Windows'
        env:
          QT_QPA_PLATFORM: windows
        run: |
          $Package = Get-ChildItem packages/*_Windows_x64.exe | Select-Object -First 1
          python tests/test_github_update.py $Package.FullName $env:GITHUB_REF_NAME
          if ($LASTEXITCODE -ne 0) { throw 'Published Windows update failed' }
      - name: Exercise macOS app update from GitHub
        if: runner.os == 'macOS'
        env:
          QT_QPA_PLATFORM: cocoa
        run: |
          ditto -x -k packages/*_macOS_arm64_update.zip runtime
          python3 tests/test_github_update.py runtime/LogAnalyQt.app/Contents/MacOS/appLogAnalyQt "$GITHUB_REF_NAME"

  macos:
    name: macOS arm64
    runs-on: macos-15
    timeout-minutes: 60
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check version and release tooling
        run: |
          python3 scripts/ci/check_build.py
          python3 -m unittest tests.test_release_automation tests.test_ci_packages tests.test_github_release -v
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.1'
          arch: clang_64
          cache: 'true'
          setup-python: 'false'
      - name: Build, test and package
        run: |
          test "$(uname -m)" = arm64
          RUN_TESTS=1 scripts/package_macos.sh
          python3 scripts/ci/check_build.py --macos-bundle build/macos-release/package/LogAnalyQt.app
          python3 scripts/ci/check_build.py --packages release_package --platform macos
          hdiutil verify release_package/*.dmg
      - name: Run deployed app without Qt environment overrides
        env:
          QT_QPA_PLATFORM: cocoa
        run: |
          test "$(lipo -archs build/macos-release/package/LogAnalyQt.app/Contents/MacOS/appLogAnalyQt)" = arm64
          env -u QT_PLUGIN_PATH -u QT_QPA_PLATFORM_PLUGIN_PATH -u QML_IMPORT_PATH -u QML2_IMPORT_PATH -u DYLD_LIBRARY_PATH -u DYLD_FRAMEWORK_PATH \
            python3 tests/test_ui_migration_runtime.py build/macos-release/package/LogAnalyQt.app/Contents/MacOS/appLogAnalyQt
          env -u QT_PLUGIN_PATH -u QT_QPA_PLATFORM_PLUGIN_PATH -u QML_IMPORT_PATH -u QML2_IMPORT_PATH -u DYLD_LIBRARY_PATH -u DYLD_FRAMEWORK_PATH \
            python3 tests/test_github_update.py build/macos-release/package/LogAnalyQt.app/Contents/MacOS/appLogAnalyQt --probe
      - uses: actions/upload-artifact@v4
        with:
          name: LogAnalyQt-macOS-arm64
          path: |
            release_package/*_macOS_arm64.dmg
            release_package/*_macOS_arm64.dmg.sha256
            release_package/*_macOS_arm64_update.zip
            release_package/*_macOS_arm64_update.zip.sha256
          if-no-files-found: error
          retention-days: 7
