name: Build Windows and macOS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  LOGANALYQT_DIAGNOSTICS_DIR: ${{ github.workspace }}/diagnostics
  PYTHONUNBUFFERED: '1'
  PYTHONUTF8: '1'

jobs:
  windows:
    name: Windows x64
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      QT_STATIC_DIR: D:/qt-static/6.11.1
      LOGANALYQT_MQTT_OPENSSL_DIR: D:/mqtt-openssl/3.5.9
      QT_QPA_PLATFORM: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check version and release tooling
        run: |
          Write-Host "Available logical CPUs: $([Environment]::ProcessorCount)"
          python scripts/ci/check_build.py
          if ($LASTEXITCODE -ne 0) { throw 'Version validation failed' }
          python -m unittest tests.test_release_automation tests.test_ci_packages tests.test_github_release tests.test_ci_workflow -v
          if ($LASTEXITCODE -ne 0) { throw 'Release tooling tests failed' }
      - name: Install Qt test tools and MinGW
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.1'
          arch: win64_mingw
          tools: 'tools_mingw1310,qt.tools.win64_mingw1310'
          # aqt 3.3 predates Qt 6.11's Windows repository layout.
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7'
          cache: 'true'
          setup-python: 'false'
      - name: Locate MinGW 13.1
        shell: pwsh
        run: |
          $Mingw = Get-ChildItem "$env:IQTA_TOOLS" -Directory -Filter 'mingw1310*' | Select-Object -First 1
          if (-not $Mingw) { throw 'MinGW 13.1 not installed' }
          "MINGW_DIR=$($Mingw.FullName)" >> $env:GITHUB_ENV
          "$($Mingw.FullName)/bin" >> $env:GITHUB_PATH
      - name: QML preflight and scroll stability (10 runs)
        run: |
          python tests/prot698_qml_tests.py
          if ($LASTEXITCODE -ne 0) { throw 'QML test tools failed' }
          python tests/prot698_qml_tests.py --filter AiAssistantWorkflow::test_longConversationScrollAndCompactBounds --repeat 10
          if ($LASTEXITCODE -ne 0) { throw 'QML scroll stability failed' }
      - name: Cache static MQTT OpenSSL
        id: mqtt-openssl-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.LOGANALYQT_MQTT_OPENSSL_DIR }}
          key: windows-2022-openssl-3.5.9-mingw1310-${{ hashFiles('scripts/ci/build_mqtt_openssl.ps1') }}
      - name: Prepare OpenSSL build tools
        id: mqtt-msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: make perl
      - name: Locate OpenSSL build tools
        run: '"LOGANALYQT_MSYS2_DIR=${{ steps.mqtt-msys2.outputs.msys2-location }}" >> $env:GITHUB_ENV'
      - name: Build static MQTT OpenSSL
        shell: pwsh
        run: ./scripts/ci/build_mqtt_openssl.ps1 -InstallDir $env:LOGANALYQT_MQTT_OPENSSL_DIR -MingwDir $env:MINGW_DIR
      - name: Save static MQTT OpenSSL before building the application
        if: steps.mqtt-openssl-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.LOGANALYQT_MQTT_OPENSSL_DIR }}
          key: ${{ steps.mqtt-openssl-cache.outputs.cache-primary-key }}
      - name: Restore static Qt
        id: qt-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.QT_STATIC_DIR }}
          key: windows-2022-qt-6.11.1-mingw1310-static-${{ hashFiles('scripts/ci/build_static_qt.ps1') }}
      - name: Build static Qt on cache miss
        if: steps.qt-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./scripts/ci/build_static_qt.ps1 -InstallDir $env:QT_STATIC_DIR -MingwDir $env:MINGW_DIR
      - name: Save static Qt before building the application
        if: steps.qt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.QT_STATIC_DIR }}
          key: ${{ steps.qt-cache.outputs.cache-primary-key }}
      - name: Configure and compile application
        shell: pwsh
        run: |
          ./scripts/package_single.ps1 -BuildTests -Phase Build
          if ($LASTEXITCODE -ne 0) { throw 'Windows compilation failed' }
      - name: Unit and integration tests
        run: |
          New-Item -ItemType Directory -Force diagnostics | Out-Null
          ctest --test-dir build_release --verbose --output-on-failure --no-tests=error --output-log diagnostics/ctest-general.log -E '^(prot698_qml_tests|stage10_qml_tests|ui_migration_runtime|macos_window_activation)$'
          if ($LASTEXITCODE -ne 0) { throw 'Unit or integration tests failed' }
      - name: Application UI runtime tests
        run: |
          ctest --test-dir build_release --verbose --output-on-failure --no-tests=error --output-log diagnostics/ctest-ui.log -R '^(ui_migration_runtime|macos_window_activation)$'
          if ($LASTEXITCODE -ne 0) { throw 'Application UI tests failed' }
      - name: Package and validate Windows executable
        shell: pwsh
        run: |
          ./scripts/package_single.ps1 -BuildTests -Phase Package
          if ($LASTEXITCODE -ne 0) { throw 'Windows packaging failed' }
          python scripts/ci/check_build.py --packages release_package --platform windows
          if ($LASTEXITCODE -ne 0) { throw 'Windows package validation failed' }
          $Package = Get-ChildItem release_package/*_Windows_x64.exe | Select-Object -First 1
          $Imports = & "$env:MINGW_DIR/bin/objdump.exe" -p $Package.FullName | Out-String
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect Windows imports' }
          if ($Imports -match 'DLL Name:\s+(Qt6|libgcc|libstdc|libwinpthread|libssl|libcrypto|mosquitto|cjson)') { throw 'Package still depends on external runtime DLLs' }
      - name: Run packaged EXE without Qt or MinGW on PATH
        shell: pwsh
        run: |
          $Python = (Get-Command python).Source
          $Package = Get-ChildItem release_package/*_Windows_x64.exe | Select-Object -First 1
          foreach ($PluginVariable in @('QT_PLUGIN_PATH', 'QT_QPA_PLATFORM_PLUGIN_PATH', 'QML_IMPORT_PATH', 'QML2_IMPORT_PATH')) {
            Remove-Item "Env:$PluginVariable" -ErrorAction SilentlyContinue
          }
          $env:PATH = "$env:SystemRoot/system32;$env:SystemRoot"
          $HiddenQt = @{}
          try {
            foreach ($QtDirectory in @($env:QT_STATIC_DIR, $env:QT_ROOT_DIR)) {
              $HiddenDirectory = "$QtDirectory-ci-hidden"
              Move-Item -LiteralPath $QtDirectory -Destination $HiddenDirectory
              $HiddenQt[$QtDirectory] = $HiddenDirectory
            }
            & $Python tests/test_ui_migration_runtime.py $Package.FullName
            if ($LASTEXITCODE -ne 0) { throw 'Standalone Windows package failed to run' }
            & $Python tests/test_github_update.py $Package.FullName --probe
            if ($LASTEXITCODE -ne 0) { throw 'Standalone Windows update HTTPS probe failed' }
          }
          finally {
            foreach ($QtDirectory in $HiddenQt.Keys) {
              Move-Item -LiteralPath $HiddenQt[$QtDirectory] -Destination $QtDirectory
            }
          }
      - name: Preserve test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CI-diagnostics-${{ runner.os }}
          path: |
            diagnostics/
            build_release/Testing/Temporary/
            build/macos-release/Testing/Temporary/
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: LogAnalyQt-Windows-x64
          path: |
            release_package/*_Windows_x64.exe
            release_package/*_Windows_x64.exe.sha256
          if-no-files-found: error
          retention-days: 7

  macos:
    name: macOS arm64
    runs-on: macos-15
    timeout-minutes: 60
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check version and release tooling
        run: |
          python3 scripts/ci/check_build.py
          python3 -m unittest tests.test_release_automation tests.test_ci_packages tests.test_github_release tests.test_ci_workflow -v
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.1'
          arch: clang_64
          cache: 'true'
          setup-python: 'false'
      - name: QML preflight and interaction stability (10 runs)
        run: |
          python3 tests/prot698_qml_tests.py
          python3 tests/stage10_qml_tests.py
          python3 tests/prot698_qml_tests.py --filter AiAssistantWorkflow::test_longConversationScrollAndCompactBounds --repeat 10
          python3 tests/stage10_qml_tests.py --filter SshMonitorWorkspace::test_monitorRuleEditorAndPicker --repeat 10
          python3 tests/stage10_qml_tests.py --filter SshMonitorWorkspace::test_followAndReceptionPauseHaveDistinctHoverHelp --repeat 10
          python3 tests/stage10_qml_tests.py --filter RemoteSecurityViews::test_sshConfigFoldPreservesDraftsAndReleasesSpace --repeat 10
      - name: Configure and compile application
        run: |
          test "$(uname -m)" = arm64
          RUN_TESTS=1 scripts/package_macos.sh "" build
      - name: Unit and integration tests
        run: |
          mkdir -p diagnostics
          ctest --test-dir build/macos-release --verbose --output-on-failure --no-tests=error --output-log diagnostics/ctest-general.log -E '^(prot698_qml_tests|stage10_qml_tests|ui_migration_runtime|macos_window_activation)$'
      - name: Application UI and native activation tests (10 runs)
        run: |
          ctest --test-dir build/macos-release --verbose --output-on-failure --no-tests=error --output-log diagnostics/ctest-ui.log -R '^(ui_migration_runtime|macos_window_activation)$'
      - name: Package and validate macOS application
        run: |
          RUN_TESTS=1 scripts/package_macos.sh "" package
          python3 scripts/ci/check_build.py --macos-bundle build/macos-release/package/通联工坊.app
          python3 scripts/ci/check_build.py --packages release_package --platform macos
          hdiutil verify release_package/*.dmg
      - name: Run deployed app without Qt environment overrides
        env:
          QT_QPA_PLATFORM: cocoa
        run: |
          test "$(lipo -archs build/macos-release/package/通联工坊.app/Contents/MacOS/appLogAnalyQt)" = arm64
          env -u QT_PLUGIN_PATH -u QT_QPA_PLATFORM_PLUGIN_PATH -u QML_IMPORT_PATH -u QML2_IMPORT_PATH -u DYLD_LIBRARY_PATH -u DYLD_FRAMEWORK_PATH \
            python3 tests/test_ui_migration_runtime.py build/macos-release/package/通联工坊.app/Contents/MacOS/appLogAnalyQt
          env -u QT_PLUGIN_PATH -u QT_QPA_PLATFORM_PLUGIN_PATH -u QML_IMPORT_PATH -u QML2_IMPORT_PATH -u DYLD_LIBRARY_PATH -u DYLD_FRAMEWORK_PATH \
            python3 tests/test_github_update.py build/macos-release/package/通联工坊.app/Contents/MacOS/appLogAnalyQt --probe
      - name: Preserve test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CI-diagnostics-${{ runner.os }}
          path: |
            diagnostics/
            build_release/Testing/Temporary/
            build/macos-release/Testing/Temporary/
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: LogAnalyQt-macOS-arm64
          path: |
            release_package/*_macOS_arm64.dmg
            release_package/*_macOS_arm64.dmg.sha256
            release_package/*_macOS_arm64_update.zip
            release_package/*_macOS_arm64_update.zip.sha256
          if-no-files-found: error
          retention-days: 7
