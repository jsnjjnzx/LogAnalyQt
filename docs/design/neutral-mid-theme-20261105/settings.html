<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>中间调外观 · 外观选择</title>
  <link rel="stylesheet" href="settings.css">
  <link rel="stylesheet" href="monokai.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <symbol id="i-logs" viewBox="0 0 24 24"><path d="M5 4h14v16H5zM8 8h8M8 12h8M8 16h5"/></symbol>
  <symbol id="i-keyboard" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M6 10h.01M9 10h.01M12 10h.01M15 10h.01M18 10h.01M7 14h10"/></symbol>
  <symbol id="i-diff" viewBox="0 0 24 24"><path d="M4 5h6v14H4zM14 5h6v14h-6zM7 9h.01M17 13h.01"/></symbol>
  <symbol id="i-windows" viewBox="0 0 24 24"><rect x="3" y="4" width="8" height="7" rx="1"/><rect x="13" y="4" width="8" height="7" rx="1"/><rect x="3" y="13" width="8" height="7" rx="1"/><rect x="13" y="13" width="8" height="7" rx="1"/></symbol>
  <symbol id="i-frame" viewBox="0 0 24 24"><path d="M8 4H4v5M16 4h4v5M8 20H4v-5M16 20h4v-5M9 9h6v6H9z"/></symbol>
  <symbol id="i-ai" viewBox="0 0 24 24"><path d="M12 3l1.4 4.1L18 8.5l-4.6 1.4L12 14l-1.4-4.1L6 8.5l4.6-1.4L12 3zM18.5 14l.9 2.6 2.6.9-2.6.9-.9 2.6-.9-2.6-2.6-.9 2.6-.9.9-2.6z"/></symbol>
  <symbol id="i-activity" viewBox="0 0 24 24"><path d="M3 12h4l2.2-5 4 10 2.1-5H21"/></symbol>
  <symbol id="i-merge" viewBox="0 0 24 24"><path d="M5 5v5c0 3 2 4 5 4h3M15 10l3 4-3 4M13 19v-5"/></symbol>
  <symbol id="i-signal" viewBox="0 0 24 24"><path d="M5 16a10 10 0 0110-10M8 19a7 7 0 017-7M11 22a4 4 0 014-4M5 20h.01"/></symbol>
  <symbol id="i-db" viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"/></symbol>
  <symbol id="i-sync" viewBox="0 0 24 24"><path d="M20 7h-7M17 4l3 3-3 3M4 17h7M7 14l-3 3 3 3"/></symbol>
  <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 00-.1-1l2-1.5-2-3.4-2.3 1a8 8 0 00-1.7-1L14.5 3h-5L9 6a8 8 0 00-1.7 1l-2.3-1-2 3.4L5 11a7 7 0 000 2l-2 1.5 2 3.4 2.3-1A8 8 0 009 18l.5 3h5l.5-3a8 8 0 001.7-1l2.3 1 2-3.4-2-1.5a7 7 0 00.1-1z"/></symbol>
  <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.8 9a2.4 2.4 0 114 1.7c-1 .8-1.8 1.3-1.8 2.8M12 17h.01"/></symbol>
</svg>

<div class="stage">
  <div class="window">
    <div class="titlebar">
      <div class="traffic"><i></i><i></i><i></i></div>
      <div class="window-title">通联工坊 v5.3.1</div>
    </div>
    <div class="shell">
      <aside class="sidebar">
        <nav class="nav">
          <div class="nav-section">分析工作台</div>
          <div class="nav-item"><svg><use href="#i-logs"/></svg>日志解析</div>
          <div class="nav-item"><svg><use href="#i-keyboard"/></svg>手动解析</div>
          <div class="nav-item"><svg><use href="#i-diff"/></svg>差异对比</div>
          <div class="nav-item"><svg><use href="#i-windows"/></svg>多窗口解析</div>
          <div class="nav-item"><svg><use href="#i-frame"/></svg>智能组帧</div>
          <div class="nav-item"><svg><use href="#i-ai"/></svg>AI 助手</div>
          <div class="nav-section">日志工具</div>
          <div class="nav-item"><svg><use href="#i-activity"/></svg>实时监控</div>
          <div class="nav-item"><svg><use href="#i-merge"/></svg>日志合并</div>
          <div class="nav-section">通信调试</div>
          <div class="nav-item"><svg><use href="#i-signal"/></svg>MQTT 调试</div>
          <div class="nav-section">资源管理</div>
          <div class="nav-item"><svg><use href="#i-db"/></svg>预置报文</div>
          <div class="nav-item"><svg><use href="#i-sync"/></svg>协议同步</div>
        </nav>
        <div class="side-footer">
          <div class="rule"></div>
          <div class="nav-item active"><svg><use href="#i-settings"/></svg>系统设置</div>
          <div class="nav-item"><svg><use href="#i-help"/></svg>帮助与更新</div>
          <div class="rule"></div>
          <div class="brand"><strong>通联工坊</strong><span>v5.3.1</span></div>
        </div>
      </aside>

      <div class="settings">
        <aside class="settings-rail">
          <div class="rail-item active">外观与快捷键</div>
          <div class="rail-item">大模型接入</div>
          <div class="rail-item">个人配置</div>
        </aside>
        <main class="settings-main">
          <div class="settings-content">
            <h1>界面外观</h1>
            <p class="lead">选择适合当前环境的外观，即时应用于所有窗口。</p>

            <div class="theme-grid">
              <div class="theme-card">
                <div class="preview light">
                  <div class="preview-side"><i></i><i></i><i></i><i></i><i></i><i></i></div>
                  <div class="preview-main">
                    <div class="preview-toolbar"><i></i><i></i><i></i><i></i></div>
                    <div class="preview-split">
                      <div class="preview-panel reader"><div class="preview-head"></div><div class="preview-line"></div><div class="preview-line"></div><div class="preview-line active"></div><div class="preview-line"></div><div class="preview-line"></div><div class="preview-line active"></div><div class="preview-line"></div></div>
                      <div class="preview-panel"><div class="preview-head"></div><div class="preview-line"></div><div class="preview-line"></div><div class="preview-line"></div><div class="preview-line active"></div><div class="preview-line"></div><div class="preview-line"></div></div>
                    </div>
                  </div>
                </div>
                <div class="theme-label"><span>浅色</span></div>
              </div>

              <div class="theme-card selected">
                <div class="preview mid">
                  <div class="preview-side"><i></i><i></i><i></i><i></i><i></i><i></i></div>
                  <div class="preview-main">
                    <div class="preview-toolbar"><i></i><i></i><i></i><i></i></div>
                    <div class="preview-split">
                      <div class="preview-panel reader"><div class="preview-head"></div><div class="preview-line"></div><div class="preview-line"></div><div class="preview-line active"></div><div class="preview-line"></div><div class="preview-line"></div><div class="preview-line active"></div><div class="preview-line"></div></div>
                      <div class="preview-panel"><div class="preview-head"></div><div class="preview-line"></div><div class="preview-line"></div><div class="preview-line"></div><div class="preview-line active"></div><div class="preview-line"></div><div class="preview-line"></div></div>
                    </div>
                  </div>
                </div>
                <div class="theme-label"><span>雾灰</span><span class="check">✓</span></div>
              </div>

              <div class="theme-card">
                <div class="preview dark">
                  <div class="preview-side"><i></i><i></i><i></i><i></i><i></i><i></i></div>
                  <div class="preview-main">
                    <div class="preview-toolbar"><i></i><i></i><i></i><i></i></div>
                    <div class="preview-split">
                      <div class="preview-panel reader"><div class="preview-head"></div><div class="preview-line"></div><div class="preview-line"></div><div class="preview-line active"></div><div class="preview-line"></div><div class="preview-line"></div><div class="preview-line active"></div><div class="preview-line"></div></div>
                      <div class="preview-panel"><div class="preview-head"></div><div class="preview-line"></div><div class="preview-line"></div><div class="preview-line"></div><div class="preview-line active"></div><div class="preview-line"></div><div class="preview-line"></div></div>
                    </div>
                  </div>
                </div>
                <div class="theme-label"><span>深色</span></div>
              </div>
            </div>

            <div class="setting-strip">
              <span>减少透明度</span>
              <div class="switch"></div>
            </div>
          </div>
        </main>
      </div>
    </div>
  </div>
</div>
<script>
  if (new URLSearchParams(location.search).get("theme") === "monokai") {
    document.body.classList.add("monokai");
    document.querySelectorAll(".theme-card")[1].querySelector(".theme-label span").textContent = "Monokai";
  }
</script>
</body>
</html>
